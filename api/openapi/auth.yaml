openapi: 3.1.0
info:
  title: CrimeKit Authentication API (skeleton)
  version: '0.1.0'
  description: OpenAPI skeleton for authentication and user management (review and extend before use).

servers:
  - url: /api

paths:
  /auth/login:
    post:
      summary: Exchange credentials for access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Returns access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string

  /auth/refresh:
    post:
      summary: Refresh an access token using a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token

  /users:
    get:
      summary: List users (pagination and filtering omitted)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of users
    post:
      summary: Create a new user
      security:
        - bearerAuth: ["admin:users"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created

  /users/me:
    get:
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user

  /roles:
    get:
      summary: List roles
      security:
        - bearerAuth: ["admin:roles"]
      responses:
        '200':
          description: Roles list

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
