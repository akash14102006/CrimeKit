# ============================================================
# CrimeKit - Docker Compose (Main)
# ============================================================
# Usage:
#   Dev:      docker compose up -d
#   Dev+Tools: docker compose --profile dev-tools up -d
#   Prod:     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Monitor:  docker compose --profile monitoring up -d
# ============================================================

services:
  # ==========================================================
  # DATABASES
  # ==========================================================

  postgres:
    image: postgres:16-alpine
    container_name: crimekit_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crimekit}
      POSTGRES_USER: ${POSTGRES_USER:-crimekit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimekit_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crimekit_app} -d ${POSTGRES_DB:-crimekit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    image: redis:7-alpine
    container_name: crimekit_redis
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-crimekit_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: crimekit_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-crimekit_dev_neo4j}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infrastructure/neo4j/neo4j.conf:/etc/neo4j/neo4j.conf:ro
      - ./infrastructure/neo4j/init.cypher:/var/lib/neo4j/init.cypher
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7475}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7688}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  # ==========================================================
  # OBJECT STORAGE
  # ==========================================================

  minio:
    image: minio/minio:latest
    container_name: crimekit_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-crimekit_dev_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-crimekit_dev_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: crimekit_minio_init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infrastructure/minio/init.sh:/init.sh:ro
    entrypoint: /bin/sh /init.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-crimekit_dev_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-crimekit_dev_minio_secret}
      MINIO_ENDPOINT: minio:9000
    networks:
      - crimekit_net
    restart: "no"

  # ==========================================================
  # APPLICATION
  # ==========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimekit_backend
    # Single worker: the realtime relay + WebSocket connection manager are
    # in-memory singletons. With multiple workers a WS client can land on a
    # different process than the relay that received the Redis event, so the
    # event is never delivered. One worker keeps relay <-> manager co-located.
    command: ["-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crimekit_app}:${POSTGRES_PASSWORD:-crimekit_dev_password}@postgres:5432/${POSTGRES_DB:-crimekit}
      REDIS_URL: redis://:${REDIS_PASSWORD:-crimekit_dev_redis}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-crimekit_dev_neo4j}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-crimekit_dev_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-crimekit_dev_minio_secret}
      JWT_SECRET: ${JWT_SECRET:-${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production-32ch}}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production-32ch}
      DESCOPE_PROJECT_ID: ${DESCOPE_PROJECT_ID:-P3FF4lAVyrTtQeqlbuAeSdoCbrIX}
      DESCOPE_MANAGEMENT_KEY: ${DESCOPE_MANAGEMENT_KEY:-K3HNFQNwEh3UXm6WaqSe7ZUw29AcvuyeW0uCsO10pHBJuPfFm2UMJDq9xN9qXBlD5zz2Uli}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      TESTING: ${TESTING:-0}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-crimekit}
      POSTGRES_USER: ${POSTGRES_USER:-crimekit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimekit_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-crimekit_dev_redis}
      REDIS_DB: "0"
      EVIDENCE_STORAGE_DIR: /app/backend/storage/evidence
      # Blockchain / Evidence Proof Fabric (disabled by default)
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-false}
      BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-polygon-amoy}
      BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-80002}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-https://rpc-amoy.polygon.technology}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      BLOCKCHAIN_ISSUER_ID: ${BLOCKCHAIN_ISSUER_ID:-}
      BLOCKCHAIN_BATCH_SIZE: ${BLOCKCHAIN_BATCH_SIZE:-128}
      BLOCKCHAIN_ANCHOR_INTERVAL_SECONDS: ${BLOCKCHAIN_ANCHOR_INTERVAL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crimekit_net
    volumes:
      - backend_logs:/app/logs
      - backend_evidence:/app/backend/storage/evidence
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G
    restart: unless-stopped

  # ==========================================================
  # REVERSE PROXY
  # ==========================================================

  nginx:
    image: nginx:alpine
    container_name: crimekit_nginx
    ports:
      - "${NGINX_HTTP_HOST_PORT:-8088}:80"
      - "${NGINX_HTTPS_HOST_PORT:-8443}:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/sites:/etc/nginx/sites-enabled:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped

  # ==========================================================
  # MONITORING (profile: monitoring)
  # ==========================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: crimekit_prometheus
    profiles:
      - monitoring
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: crimekit_grafana
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # ==========================================================
  # DEV TOOLS (profile: dev-tools)
  # ==========================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crimekit_pgadmin
    profiles:
      - dev-tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crimekit.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: crimekit_redis_commander
    profiles:
      - dev-tools
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_HOST_PORT:-6382}:6381"
    networks:
      - crimekit_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    name: crimekit_postgres_data
  redis_data:
    name: crimekit_redis_data
  neo4j_data:
    name: crimekit_neo4j_data
  neo4j_logs:
    name: crimekit_neo4j_logs
  minio_data:
    name: crimekit_minio_data
  backend_logs:
    name: crimekit_backend_logs
  backend_evidence:
    name: crimekit_backend_evidence
  nginx_logs:
    name: crimekit_nginx_logs
  prometheus_data:
    name: crimekit_prometheus_data
  grafana_data:
    name: crimekit_grafana_data

# ============================================================
# NETWORKS
# ============================================================
networks:
  crimekit_net:
    driver: bridge
    name: crimekit_network
