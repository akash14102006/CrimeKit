# ============================================
# CrimeKit Neo4j Community Edition Configuration
# ============================================

# Server
server.default_listen_address=0.0.0.0
server.http.listen_address=0.0.0.0:7474
server.bolt.listen_address=0.0.0.0:7687

# Directories
server.directories.data=/data
server.directories.logs=/logs
server.directories.tmp=/tmp

# Memory (conservative for dev)
server.memory.heap.initial_size=256m
server.memory.heap.max_size=512m
server.memory.pagecache.size=512m

# Timeouts
dbms.transaction.timeout=60s
dbms.query.timeout=30s

# Logging
dbms.logs.query.enabled=true
dbms.logs.query.rotation.keep_number=5
dbms.logs.query.rotation.size=10m

# Security
dbms.security.auth_enabled=true

# Backup
dbms.backup.enabled=true
dbms.backup.listen_address=0.0.0.0:6362

# Init script (runs once on first start)
dbms.init_script=/var/lib/neo4j/init.cypher
