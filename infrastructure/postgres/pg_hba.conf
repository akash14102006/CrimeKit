# ============================================================
# CrimeKit PostgreSQL Client Authentication Configuration
# ============================================================
# TYPE  DATABASE    USER        ADDRESS         METHOD

# Local connections – postgres superuser via peer auth
local   all         postgres                    peer

# Local connections for the application user
local   crimekit    crimekit_app                scram-sha-256

# Remote IPv4 connections
host    all         all             0.0.0.0/0   scram-sha-256

# Remote IPv6 connections
host    all         all             ::/0        scram-sha-256

# Replication access (restrict to specific IPs in production)
# host  replication crimekit_app    10.0.0.0/8  scram-sha-256
