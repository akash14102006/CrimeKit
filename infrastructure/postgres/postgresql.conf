# ============================================================
# CrimeKit Production PostgreSQL Configuration
# Based on PostgreSQL 16+ defaults tuned for a 4-8GB RAM server
# ============================================================

# ------------------------------------------------------------
# Connection Settings
# ------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200

# NOTE: For production, use an external connection pooler (PgBouncer
# or SQLAlchemy pool) in front of PostgreSQL. 200 direct connections
# is already high; prefer pooler with a smaller server-side limit.

# ------------------------------------------------------------
# Memory Settings
# ------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB
huge_pages = try

# ------------------------------------------------------------
# WAL Settings
# ------------------------------------------------------------
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_level = replica
max_wal_senders = 5
wal_keep_size = 1GB

# ------------------------------------------------------------
# Query Planner / Performance
# ------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
seq_page_cost = 1.0
jit = on

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'mod'
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ------------------------------------------------------------
# Security
# ------------------------------------------------------------
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'

# ------------------------------------------------------------
# Autovacuum (tuned for production write loads)
# ------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms

# ------------------------------------------------------------
# Miscellaneous
# ------------------------------------------------------------
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
