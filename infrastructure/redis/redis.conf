# ============================================
# CrimeKit Redis Configuration - Development
# ============================================

# Network
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60
maxclients 1000

# Security
requirepass crimekit_dev_redis
protected-mode yes
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
rdbcompression yes

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Logging
loglevel notice

# Databases
databases 16
# DB 0: cache
# DB 1: sessions
# DB 2: pub/sub
