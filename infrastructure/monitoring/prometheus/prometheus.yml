global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: production
    cluster: crimekit

scrape_configs:
  - job_name: "crimekit-backend"
    static_configs:
      - targets: ["backend:9464"]
        labels:
          service: crimekit-backend
          tier: application
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
          tier: infrastructure
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          tier: monitoring
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
          tier: monitoring
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
          tier: infrastructure
    scrape_interval: 30s

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          tier: data
    scrape_interval: 30s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          tier: data
    scrape_interval: 30s

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio
          tier: storage
    metrics_path: /minio/v2/metrics/cluster
    scrape_interval: 30s
