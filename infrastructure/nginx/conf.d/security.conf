# =============================================================================
# CrimeKit Security Configuration Snippet
# =============================================================================
# Security-focused settings for rate limiting, timeouts, and hardening.
# =============================================================================

# Request size limits
client_body_timeout 120s;
client_header_timeout 60s;
large_client_header_buffers 4 16k;

# Timeout settings (extended for AI processing workloads)
proxy_connect_timeout 60s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

# Hide server version information
server_tokens off;
