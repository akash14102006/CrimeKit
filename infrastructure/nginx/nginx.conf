# =============================================================================
# CrimeKit Nginx Main Configuration
# =============================================================================
# High-performance reverse proxy for the CrimeKit forensic platform.
# Optimized for large evidence file uploads and AI processing workloads.
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# -----------------------------------------------------------------------------
# Events
# -----------------------------------------------------------------------------
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # -------------------------------------------------------------------------
    # Client settings (500M for evidence uploads)
    # -------------------------------------------------------------------------
    client_max_body_size 500M;
    client_body_buffer_size 1M;
    client_body_timeout 120s;
    client_header_timeout 60s;

    # -------------------------------------------------------------------------
    # Proxy buffer settings
    # -------------------------------------------------------------------------
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
    proxy_buffering on;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        application/json
        application/javascript
        text/css
        application/xml
        text/xml
        application/xhtml+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers (applied to all responses)
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # -------------------------------------------------------------------------
    # Rate limiting zones
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # -------------------------------------------------------------------------
    # Upstream backend
    # -------------------------------------------------------------------------
    upstream backend {
        server backend:8002;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Site configurations
    # -------------------------------------------------------------------------
    include /etc/nginx/sites-enabled/*;
}
