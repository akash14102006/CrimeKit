# =============================================================================
# CrimeKit Default Server Block
# =============================================================================
# Primary entry point for all HTTP traffic. Routes requests to the backend
# API server with rate limiting, WebSocket support, and static file serving.
# =============================================================================

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # HTTP to HTTPS redirect
    # -------------------------------------------------------------------------
    # Uncomment when SSL certificates are available:
    # return 301 https://$host$request_uri;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/crimekit_access.log json;
    error_log /var/log/nginx/crimekit_error.log warn;

    # -------------------------------------------------------------------------
    # Default proxy to backend
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # API endpoints with rate limiting (10 req/s)
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # File upload endpoints with strict rate limiting (2 req/s)
    # -------------------------------------------------------------------------
    location /uploads/ {
        limit_req zone=upload burst=10 nodelay;
        limit_req_status 429;

        client_max_body_size 500M;
        proxy_request_buffering off;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Legacy singular /upload/ alias
    location /upload/ {
        limit_req zone=upload burst=10 nodelay;
        limit_req_status 429;

        client_max_body_size 500M;
        proxy_request_buffering off;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # -------------------------------------------------------------------------
    # Health check endpoint (no rate limiting, self-contained)
    # -------------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # Backend health proxy (requires backend up)
    location = /backend-health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    # -------------------------------------------------------------------------
    # Static files with aggressive caching
    # -------------------------------------------------------------------------
    location /static/ {
        alias /app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Serve pre-compressed files if available
        gzip_static on;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please slow down."}';
    }

    error_page 502 /502.json;
    location = /502.json {
        internal;
        default_type application/json;
        return 502 '{"error":"bad_gateway","message":"The server is temporarily unavailable. Please try again later."}';
    }

    error_page 503 /503.json;
    location = /503.json {
        internal;
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"The service is currently unavailable. Please try again later."}';
    }

    error_page 504 /504.json;
    location = /504.json {
        internal;
        default_type application/json;
        return 504 '{"error":"gateway_timeout","message":"The request timed out. Please try again."}';
    }

    # -------------------------------------------------------------------------
    # Block dotfiles except .well-known
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }
}
