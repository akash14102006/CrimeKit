name: Terraform Validate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  terraform:
    name: Terraform fmt/validate/plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Terraform fmt
        run: |
          cd infrastructure/terraform || exit 0
          terraform fmt -check -recursive

      - name: Terraform init & validate
        run: |
          cd infrastructure/terraform || exit 0
          terraform init -input=false
          terraform validate

      - name: Terraform plan (no apply)
        run: |
          cd infrastructure/terraform || exit 0
          # Run plan when cloud credentials are provided in deployment environment;
          # skip speculative cloud refresh when unauthenticated in PR CI to prevent auth failure.
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            terraform plan -input=false -refresh=false -no-color
          else
            echo "AWS credentials not present in runner environment; validation completed successfully."
          fi
