apiVersion: v2
name: crimekit
description: CrimeKit Enterprise Platform - Forensic analysis and crime investigation toolkit
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - crimekit
  - forensic
  - investigation
  - enterprise
  - analytics
home: https://github.com/crimekit/crimekit
sources:
  - https://github.com/crimekit/crimekit
maintainers:
  - name: CrimeKit Team
    email: team@crimekit.dev
dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: neo4j
    version: "5.x.x"
    repository: https://neo4j.com/helm-charts/
    condition: neo4j.enabled
  - name: minio
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: CrimeKit Team
      email: team@crimekit.dev
