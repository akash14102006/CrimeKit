apiVersion: v1
kind: Service
metadata:
  name: {{ include "crimekit.fullname" . }}-backend
  labels:
    {{- include "crimekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.backend.service.targetPort }}"
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: {{ .Values.backend.service.protocol }}
      name: http
  selector:
    {{- include "crimekit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
