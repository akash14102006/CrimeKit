apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crimekit.fullname" . }}-config
  labels:
    {{- include "crimekit.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  WORKERS: "4"
  HOST: "0.0.0.0"
  PORT: "8000"
  APP_NAME: "{{ .Chart.Name }}"
  APP_VERSION: "{{ .Chart.AppVersion }}"
  CORS_ORIGINS: "https://{{ (index .Values.ingress.hosts 0).host }}"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RATE: "100"
  RATE_LIMIT_WINDOW: "60"
  METRICS_ENABLED: "true"
  METRICS_PORT: "8000"
  HEALTH_CHECK_PATH: "/health"
  UPLOAD_MAX_SIZE: "52428800"
  SESSION_EXPIRY: "3600"
  CACHE_TTL: "300"
  NEO4J_ENCRYPTED: "true"
  MINIO_USE_SSL: "true"
  ALLOWED_ORIGINS: "https://{{ (index .Values.ingress.hosts 0).host }},https://www.{{ (index .Values.ingress.hosts 0).host }}"
  ENABLE_CORS: "true"
  TRUSTED_HOSTS: "{{ (index .Values.ingress.hosts 0).host }}"
